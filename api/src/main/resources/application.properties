# --- Servidor ---
server.port=8080

# --- Base de Datos MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/tikal_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=tu_password_secreta
# Ahora que no estamos en producción no hay problema con poner una pasword aleatoria aquí
# Luego cambiaremos a una variable de entorno.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA y Hibernate ---
# IMPORTANTE: Como tenemos un script propio, usamos 'validate' o 'none' para producción,
# pero 'always' en inicialización para cargar nuestros scripts.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# --- Spring AI (Ejemplo con OpenAI) ---
#spring.ai.openai.api-key=${OPENAI_API_KEY}

spring.application.name=api
