# --- Servidor ---
server.port=8080
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Base de Datos MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/tikal_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=tu_password_secreta
# Ahora que no estamos en produccion no hay problema con poner una pasword aleatoria aqui
# Luego cambiaremos a una variable de entorno.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA y Hibernate ---
# IMPORTANTE: Cambiamos esto para que las ENTIDADES creen la BD
spring.jpa.hibernate.ddl-auto=update
# 'update': Crea las tablas si no existen, o las actualiza si cambias el codigo Java.
# 'create-drop': Borra al cerrar la app (Util para pruebas limpias).

# Activamos la carga del script SQL
spring.sql.init.mode=always

# Spring espera a que Hibernate cree y modifique las tablas antes de ejecutar el script SQL
spring.jpa.defer-datasource-initialization=true

spring.jpa.show-sql=true
spring.application.name=api

# --- Spring AI (Conectado a GROQ) ---
# Real API key of GROQ
spring.ai.openai.api-key=tu_groq_api_key_aqui
# OpenAI redirection to the groq servers
spring.ai.openai.base-url=https://api.groq.com/openai/v1
# Groq model.
spring.ai.openai.chat.options.model=llama-3.1-8b-instant
# Temperature (0.0 = Robotic/Accurate, 1.0 = Creative/Crazy)
spring.ai.openai.chat.options.temperature=0.7
# Avoid the fail of Ollama autoconfiguration
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.ollama.OllamaAutoConfiguration


