# --- Servidor ---
server.port=8080
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Base de Datos MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/tikal_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=tu_password_secreta
# Ahora que no estamos en produccion no hay problema con poner una pasword aleatoria aqui
# Luego cambiaremos a una variable de entorno.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA y Hibernate ---
# IMPORTANTE: Cambiamos esto para que las ENTIDADES creen la BD
spring.jpa.hibernate.ddl-auto=update
# 'update': Crea las tablas si no existen, o las actualiza si cambias el codigo Java.
# 'create-drop': Borra al cerrar la app (Util para pruebas limpias).

# Activamos la carga del script SQL
spring.sql.init.mode=always

# Spring espera a que Hibernate cree y modifique las tablas antes de ejecutar el script SQL
spring.jpa.defer-datasource-initialization=true

spring.jpa.show-sql=true
spring.application.name=api

